name: Deploy Authentik PORTAL to Elestio with Monk CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'deployments/monk/**'
      - '.github/workflows/monk-deploy.yaml'
      - 'docker-compose.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Authentik version to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MONK_VERSION: latest

jobs:
  build-and-test:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker images
        run: |
          docker buildx build \
            --tag authentik-server:${{ github.sha }} \
            --tag authentik-server:latest \
            -f Dockerfile.server \
            .
      
      - name: Run image security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: authentik-server:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  validate-config:
    name: Validate Monk Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Monk CLI
        run: |
          curl -fsSL https://get.monk.io/install.sh | bash
          monk --version
      
      - name: Validate Monk configuration
        run: |
          monk validate deployments/monk/portal-elestio.yaml
      
      - name: Parse Monk runfile
        run: |
          monk load deployments/monk/portal-elestio.yaml
          monk list

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-config]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    
    environment:
      name: staging
      url: https://portal-staging.marfi.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Monk CLI
        run: |
          curl -fsSL https://get.monk.io/install.sh | bash
      
      - name: Configure Monk cluster
        run: |
          monk cluster set \
            --name marfi-staging-cluster \
            --key ${{ secrets.MONK_CLUSTER_KEY }} \
            --endpoint ${{ secrets.MONK_ENDPOINT_STAGING }}
      
      - name: Decrypt environment secrets
        run: |
          echo "${{ secrets.STAGING_SECRETS }}" | base64 -d > .env.staging
      
      - name: Deploy using Monk
        run: |
          monk load deployments/monk/portal-elestio.yaml
          monk run marfi/portal/authentik \
            --tag staging \
            --namespace marfi-portal-staging \
            --env-file .env.staging \
            --replicas 1
      
      - name: Wait for deployment
        run: |
          monk describe marfi/portal/authentik \
            --wait \
            --timeout 300s
      
      - name: Run health checks
        run: |
          curl -f https://portal-staging.marfi.app/-/health/live/ || exit 1
          echo "Staging deployment healthy"
      
      - name: Clean up
        if: always()
        run: |
          rm -f .env.staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-config]
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://portal.marfi.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify production secrets
        run: |
          if [ -z "${{ secrets.PROD_AUTHENTIK_SECRET_KEY }}" ]; then
            echo "❌ Missing required secrets"
            exit 1
          fi
          echo "✅ All production secrets present"
      
      - name: Install Monk CLI
        run: |
          curl -fsSL https://get.monk.io/install.sh | bash
      
      - name: Configure Monk cluster
        run: |
          monk cluster set \
            --name marfi-prod-cluster \
            --key ${{ secrets.MONK_CLUSTER_KEY }} \
            --endpoint ${{ secrets.MONK_ENDPOINT_PROD }}
      
      - name: Create backup before deployment
        run: |
          monk backup marfi/portal/authentik \
            --namespace marfi-portal-prod \
            --name authentik-pre-deploy-$(date +%s)
      
      - name: Decrypt environment secrets
        run: |
          echo "${{ secrets.PROD_SECRETS }}" | base64 -d > .env.production
      
      - name: Deploy using Monk (Blue-Green)
        run: |
          monk load deployments/monk/portal-elestio.yaml
          
          # Deploy blue-green
          monk run marfi/portal/authentik \
            --tag production-green \
            --namespace marfi-portal-prod-green \
            --env-file .env.production \
            --replicas 2 \
            --strategy blue-green
      
      - name: Wait for green deployment
        run: |
          monk describe marfi/portal/authentik \
            --namespace marfi-portal-prod-green \
            --wait \
            --timeout 600s
      
      - name: Run production health checks
        run: |
          for i in {1..5}; do
            if curl -f https://portal.marfi.app/-/health/live/; then
              echo "✅ Health check $i passed"
              break
            else
              echo "⚠️  Health check $i failed, retrying..."
              sleep 10
            fi
          done
      
      - name: Run smoke tests
        run: |
          ./scripts/smoke-tests.sh
      
      - name: Verify database migrations
        run: |
          monk exec marfi/portal/authentik \
            "authentik migrate"
      
      - name: Switch traffic to green
        run: |
          monk service route \
            --service marfi/portal/authentik \
            --namespace marfi-portal-prod \
            --target marfi-portal-prod-green \
            --percentage 100
      
      - name: Wait and monitor
        run: |
          sleep 60
          # Monitor metrics/logs
          monk logs marfi/portal/authentik \
            --namespace marfi-portal-prod-green \
            --tail 100
      
      - name: Clean up old deployment
        if: success()
        run: |
          monk remove marfi/portal/authentik \
            --namespace marfi-portal-prod-blue \
            --force
      
      - name: Clean up
        if: always()
        run: |
          rm -f .env.production
      
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "✅ PORTAL deployment to production successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PORTAL Deployment Successful* 🚀\n*Environment:* Production\n*Domain:* https://portal.marfi.app\n*Version:* ${{ github.sha }}\n*Commit:* ${{ github.event.head_commit.message }}"
                  }
                }
              ]
            }
      
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "❌ PORTAL deployment to production failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PORTAL Deployment Failed* ⚠️\n*Environment:* Production\n*Domain:* https://portal.marfi.app\n*Commit:* ${{ github.event.head_commit.message }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Install Monk CLI
        run: |
          curl -fsSL https://get.monk.io/install.sh | bash
      
      - name: Configure Monk cluster
        run: |
          monk cluster set \
            --name marfi-prod-cluster \
            --key ${{ secrets.MONK_CLUSTER_KEY }} \
            --endpoint ${{ secrets.MONK_ENDPOINT_PROD }}
      
      - name: Rollback to previous version
        run: |
          monk rollback marfi/portal/authentik \
            --namespace marfi-portal-prod \
            --to previous
      
      - name: Verify rollback
        run: |
          monk describe marfi/portal/authentik \
            --namespace marfi-portal-prod
      
      - name: Notify Slack on rollback
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "⚠️ PORTAL rolled back to previous version",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PORTAL Rollback Executed* ⚠️\n*Environment:* Production\n*Status:* Previous version restored\n*Domain:* https://portal.marfi.app"
                  }
                }
              ]
            }
