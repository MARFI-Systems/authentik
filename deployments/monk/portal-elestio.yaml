---
# Monk CI/CD Configuration for Authentik PORTAL
# Deployment target: Elestio
# Domain: portal.marfi.app
# Service name: PORTAL

namespace: marfi/portal

service: authentik
  metadata:
    name: PORTAL
    description: |
      Authentik Identity Provider for MARFI Systems
      Enterprise-grade SSO, OAuth2/OIDC, SAML, LDAP, RADIUS
    tags:
      - authentication
      - sso
      - identity
      - marfi
    version: "2024.12"
    owner: MARFI Systems
    region: us-east-1
  
  containers:
    server:
      image: ghcr.io/goauthentik/server:latest
      image-tag: latest
      ports:
        - 9000:9000/http
        - 9443:9443/https
      environment:
        # Core Configuration
        AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
        AUTHENTIK_INSECURE: "false"
        
        # PostgreSQL Database
        AUTHENTIK_POSTGRESQL__HOST: ${DB_HOST}
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_POSTGRESQL__USER: ${DB_USER}
        AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD}
        AUTHENTIK_POSTGRESQL__NAME: ${DB_NAME}
        AUTHENTIK_POSTGRESQL__SSL_MODE: "require"
        
        # Redis Cache
        AUTHENTIK_REDIS__HOST: ${REDIS_HOST}
        AUTHENTIK_REDIS__PORT: "6379"
        AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
        AUTHENTIK_REDIS__DB: "0"
        
        # Email Configuration
        AUTHENTIK_EMAIL__HOST: ${EMAIL_HOST}
        AUTHENTIK_EMAIL__PORT: "587"
        AUTHENTIK_EMAIL__USERNAME: ${EMAIL_USER}
        AUTHENTIK_EMAIL__PASSWORD: ${EMAIL_PASSWORD}
        AUTHENTIK_EMAIL__USE_TLS: "true"
        AUTHENTIK_EMAIL__FROM: "noreply@portal.marfi.app"
        AUTHENTIK_EMAIL__FROM_NAME: "MARFI Portal"
        AUTHENTIK_EMAIL__TIMEOUT: "10"
        
        # Domain & URLs
        AUTHENTIK_PRIMARY_DOMAIN: "portal.marfi.app"
        AUTHENTIK_BOOTSTRAP_FLOW_AUTHENTICATION: "default-authentication-flow"
        AUTHENTIK_BOOTSTRAP_FLOW_ENROLLMENT: "default-enrollment-flow"
        AUTHENTIK_BOOTSTRAP_FLOW_RECOVERY: "default-password-recovery"
        AUTHENTIK_BOOTSTRAP_FLOW_STAGE_PROMPT_ACTIVATION: "default-prompt-stage-prompt"
        
        # Error Reporting & Logging
        AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
        AUTHENTIK_ERROR_REPORTING__ENVIRONMENT: "production"
        AUTHENTIK_LOG_LEVEL: "info"
        
        # TLS/SSL
        AUTHENTIK_SECURE_COOKIES: "true"
        AUTHENTIK_SESSION_COOKIE_SECURE: "true"
        AUTHENTIK_SESSION_COOKIE_HTTP_ONLY: "true"
        AUTHENTIK_SESSION_COOKIE_SAME_SITE: "Lax"
        
        # Security Headers
        AUTHENTIK_CSRF_TRUSTED_ORIGINS: "portal.marfi.app"
        
        # Outposts
        AUTHENTIK_LISTEN: "0.0.0.0:9000"
        AUTHENTIK_LISTEN_HTTPS: "0.0.0.0:9443"
      
      volumes:
        - /var/lib/authentik/data:/var/lib/authentik/data
        - /var/lib/authentik/certs:/certs
      
      health-check:
        type: http
        path: /-/health/live/
        port: 9000
        interval: 10s
        timeout: 30s
        retries: 3
    
    worker:
      image: ghcr.io/goauthentik/worker:latest
      image-tag: latest
      environment:
        # Core Configuration
        AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
        
        # PostgreSQL Database
        AUTHENTIK_POSTGRESQL__HOST: ${DB_HOST}
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_POSTGRESQL__USER: ${DB_USER}
        AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD}
        AUTHENTIK_POSTGRESQL__NAME: ${DB_NAME}
        AUTHENTIK_POSTGRESQL__SSL_MODE: "require"
        
        # Redis Cache
        AUTHENTIK_REDIS__HOST: ${REDIS_HOST}
        AUTHENTIK_REDIS__PORT: "6379"
        AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
        
        # Logging
        AUTHENTIK_LOG_LEVEL: "info"
      
      volumes:
        - /var/lib/authentik/data:/var/lib/authentik/data

  variables:
    # Required Secrets
    AUTHENTIK_SECRET_KEY:
      type: string
      description: "Secret key for Authentik - generate with: openssl rand -base64 32"
      required: true
      secret: true
    
    # Database Configuration
    DB_HOST:
      type: string
      description: "PostgreSQL host (Elestio provides this)"
      default: "postgres"
      required: true
    
    DB_USER:
      type: string
      description: "PostgreSQL user"
      default: "authentik"
      required: true
    
    DB_PASSWORD:
      type: string
      description: "PostgreSQL password - generate with: openssl rand -base64 32"
      required: true
      secret: true
    
    DB_NAME:
      type: string
      description: "PostgreSQL database name"
      default: "authentik"
      required: true
    
    # Redis Configuration
    REDIS_HOST:
      type: string
      description: "Redis host"
      default: "redis"
      required: true
    
    REDIS_PASSWORD:
      type: string
      description: "Redis password - generate with: openssl rand -base64 32"
      required: true
      secret: true
    
    # Email Configuration (SMTP)
    EMAIL_HOST:
      type: string
      description: "SMTP server hostname (e.g., smtp.sendgrid.net)"
      required: true
    
    EMAIL_USER:
      type: string
      description: "SMTP username (e.g., apikey)"
      required: true
      secret: true
    
    EMAIL_PASSWORD:
      type: string
      description: "SMTP password or API key"
      required: true
      secret: true
  
  checks:
    http-health:
      type: http
      path: /-/health/live/
      port: 9000
      wait-interval: 15s
      timeout: 60s
      expected-status: 200
    
    https-health:
      type: http
      path: /-/health/live/
      port: 9443
      wait-interval: 15s
      timeout: 60s
      expected-status: 200
      protocol: https

  dependencies:
    - postgres-service
    - redis-service

  affinity:
    platform: 
      - linux/amd64
      - linux/arm64

  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 250m

  scaling:
    replicas: 2
    strategy: rolling
    max-unavailable: 1
    max-surge: 1

  lifecycle:
    startup-probe:
      http:
        path: /-/health/live/
        port: 9000
      initial-delay-seconds: 30
      timeout-seconds: 30
      period-seconds: 10
      success-threshold: 1
      failure-threshold: 3

---
# PostgreSQL Service for Authentik
service: postgres
  metadata:
    name: postgres
    description: PostgreSQL database for Authentik

  image: postgres:16-alpine
  ports:
    - 5432:5432
  
  environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: ${DB_NAME}
  
  volumes:
    - /var/lib/postgresql/data:/var/lib/postgresql/data

---
# Redis Service for Authentik
service: redis
  metadata:
    name: redis
    description: Redis cache for Authentik

  image: redis:7-alpine
  ports:
    - 6379:6379
  
  command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
  
  volumes:
    - /var/lib/redis/data:/data

---
# Ingress Configuration
ingress:
  name: authentik-portal
  
  rules:
    - host: portal.marfi.app
      paths:
        - path: /
          backend:
            service: authentik
            port: 9000
  
  tls:
    enabled: true
    cert-issuer: letsencrypt-prod
    hosts:
      - portal.marfi.app

---
# Monitoring & Observability
monitoring:
  prometheus:
    enabled: true
    port: 9090
  
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  
  traces:
    enabled: false  # Set to true for OTLP integration

---
# Backup Configuration
backup:
  schedule: "0 2 * * *"  # 2 AM daily
  retention: 30  # days
  targets:
    - type: volume
      source: /var/lib/authentik/data
    - type: database
      source: postgres
